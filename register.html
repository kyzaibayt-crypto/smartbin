<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Регистрация — SmartBin</title>

    <link
        rel="stylesheet"
        href="register.css">

</head>

<body>

<header class="header">

    <a
        href="index.html"
        class="logo">

        ♻️ SmartBin

    </a>

    <nav>

        <a href="index.html">
            Мусорки
        </a>

        <a href="index.html#about">
            О проекте
        </a>

    </nav>

    <a
        href="login.html"
        class="login-link">

        Войти

    </a>

</header>


<main class="register-page">

    <div class="register-container">

        <div class="register-icon">
            ♻️
        </div>

        <h1>
            Создать аккаунт
        </h1>

        <p class="subtitle">
            Зарегистрируйтесь, чтобы пользоваться SmartBin
        </p>


        <form id="registerForm">

            <div class="form-group">

                <label for="username">
                    Имя пользователя
                </label>

                <input
                    type="text"
                    id="username"
                    placeholder="Введите имя"
                    autocomplete="username"
                    required>

            </div>


            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="example@mail.com"
                    autocomplete="email"
                    required>

            </div>


            <div class="form-group">

                <label for="password">
                    Пароль
                </label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        id="password"
                        placeholder="Минимум 6 символов"
                        autocomplete="new-password"
                        required>

                    <button
                        type="button"
                        id="showPassword"
                        class="show-password">

                        👁️

                    </button>

                </div>

            </div>


            <div class="form-group">

                <label for="confirmPassword">
                    Повторите пароль
                </label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Повторите пароль"
                        autocomplete="new-password"
                        required>

                    <button
                        type="button"
                        id="showConfirmPassword"
                        class="show-password">

                        👁️

                    </button>

                </div>

            </div>


            <button
                type="submit"
                class="register-button">

                Зарегистрироваться

            </button>

        </form>


        <p class="login-text">

            Уже есть аккаунт?

            <a href="login.html">
                Войти
            </a>

        </p>

    </div>

</main>


<footer>

    <div class="footer-logo">
        ♻️ SmartBin
    </div>

    <p>
        Умные решения для чистого города.
    </p>

    <span>
        © 2026 SmartBin Project
    </span>

</footer>


<script src="register.js"></script>

</body>

</html>
