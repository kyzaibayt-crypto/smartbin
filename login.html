<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Вход — SmartBin</title>

    <link
        rel="stylesheet"
        href="login.css">

</head>

<body>

<header class="header">

    <a
        href="index.html"
        class="logo">

        ♻️ SmartBin

    </a>

    <nav>

        <a href="index.html">
            Мусорки
        </a>

        <a href="index.html#about">
            О проекте
        </a>

    </nav>

    <a
        href="register.html"
        class="register-link">

        Регистрация

    </a>

</header>


<main class="login-page">

    <div class="login-container">

        <div class="login-icon">
            ♻️
        </div>

        <h1>
            С возвращением!
        </h1>

        <p class="subtitle">
            Войдите в свой аккаунт SmartBin
        </p>


        <form id="loginForm">

            <div class="form-group">

                <label for="login">
                    Имя пользователя или Email
                </label>

                <input
                    type="text"
                    id="login"
                    placeholder="Введите имя или email"
                    autocomplete="username"
                    required>

            </div>


            <div class="form-group">

                <label for="password">
                    Пароль
                </label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        id="password"
                        placeholder="Введите пароль"
                        autocomplete="current-password"
                        required>

                    <button
                        type="button"
                        id="showPassword"
                        class="show-password">

                        👁️

                    </button>

                </div>

            </div>


            <button
                type="submit"
                class="login-button">

                Войти

            </button>

        </form>


        <p class="register-text">

            Нет аккаунта?

            <a href="register.html">
                Зарегистрироваться
            </a>

        </p>

    </div>

</main>


<footer>

    <div class="footer-logo">
        ♻️ SmartBin
    </div>

    <p>
        Умные решения для чистого города.
    </p>

    <span>
        © 2026 SmartBin Project
    </span>

</footer>


<script src="login.js"></script>

</body>

</html>
